version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: edenvanguard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: edenvanguard
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: edenvanguard
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edenvanguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2-alpine
    container_name: edenvanguard-nats
    restart: unless-stopped
    command: ["--jetstream", "--store_dir", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./data/nats:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
